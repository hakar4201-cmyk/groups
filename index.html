<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گروپەکان</title>
<style>
:root{--bg:#f3f5f7;--s:#fff;--t:#14202b;--m:#5b6b7a;--l:#d5dde4;--a:#0f6b5c;--at:#fff;--e:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e151b;--s:#16212a;--t:#e8eef3;--m:#93a4b3;--l:#2a3a47;--a:#3cc4a8;--at:#06231d;--e:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:10px 10px 28px}
.c{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:10px;margin-bottom:10px}
.f{display:flex;align-items:center;gap:8px;margin-bottom:8px;direction:ltr}
.f b{min-width:1.4rem;text-align:center;font-family:monospace;font-size:1.1rem}
.f span{font-family:monospace;font-size:.95rem;color:var(--m);white-space:nowrap}
input{flex:1;min-width:0;direction:ltr;text-align:left;font:inherit;font-family:monospace;font-size:1rem;padding:7px;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px}
.err{color:var(--e);font-size:.85rem;min-height:1.2em;direction:rtl}
.top{display:flex;align-items:center;margin:4px 0 10px}
.kb{display:flex;align-items:center;gap:6px;direction:ltr}
.y{background:#ffd60a;color:#14202b;font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:6px;direction:ltr;text-align:center;font-family:monospace}
.kb button{width:26px;height:26px;padding:0;font-size:1rem;line-height:1;font-weight:700;color:var(--t);background:var(--bg);border:1px solid var(--l)}
.res{min-height:3rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px;border-radius:10px;font-weight:700;font-size:1.4rem;direction:ltr;text-align:center;word-break:break-all;padding:8px 10px;background:#ffd60a;color:#14202b}
.res .d{font-weight:400;opacity:.6}
.res.e{background:none;border:1px dashed var(--l);color:var(--m);font-size:.95rem;font-weight:400;direction:rtl}
.tot{direction:ltr;text-align:left;color:var(--m);font-family:monospace;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:6px}
button{font:inherit;cursor:pointer;border-radius:8px}
.rb{flex:1;padding:9px;font-size:1rem;font-weight:700;color:var(--t);background:var(--bg);border:1px solid var(--l)}
.rb.on{color:var(--at);background:var(--a);border-color:var(--a)}
.del{padding:0 12px;font-size:.85rem;color:var(--e);background:none;border:1px solid var(--l)}
.empty{text-align:center;color:var(--m);padding:10px}
</style>
</head>
<body>
<main>
<div class="c">
<div class="f"><b>n</b><span>=</span><input id="N" value="A, B, C, D, E" autocomplete="off"></div>
<div class="top">
<div class="kb"><button id="km" type="button">−</button><span class="y">k = <span id="kv">3</span></span><button id="kp" type="button">+</button></div>
</div>
<div class="err" id="err"></div>
</div>
<div class="c"><div class="res e" id="res"></div></div>
<div class="c"><div class="tot" id="tot"></div><div id="rows"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const names=s=>s.split(/[,،]/).map(x=>x.trim()).filter(Boolean);
let k=3,R=[],gone=new Set(),sel=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function combos(a,k){
const out=[],idx=[];
(function rec(s){
if(idx.length===k){out.push(idx.map(i=>a[i]));return}
for(let i=s;i<a.length;i++){idx.push(i);rec(i+1);idx.pop()}
})(0);
return out;
}
function binom(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)}
function gen(){
$('err').textContent='';sel=null;gone=new Set();R=[];
const a=names($('N').value);
if(k>a.length)$('err').textContent='k لە ژمارەی ناوەکان گەورەترە.';
else if(binom(a.length,k)>20000)$('err').textContent='ڕیزەکان زۆرن. ناو یان k کەم بکەرەوە.';
else{
const res=[];
for(const g of shuffle(combos(a,k))){
const s=new Set(g);
if(res.every(x=>{let c=0;for(const v of s)if(x.s.has(v))c++;return c<=1}))res.push({g,s});
}
R=res.map(x=>x.g);
}
render();
}
function render(){
const r=$('res'),cur=sel!==null&&!gone.has(sel)?R[sel]:null;
if(cur){r.className='res';r.innerHTML=cur.map((p,i)=>(i?'<span class="d">-</span>':'')+'<span>'+esc(p)+'</span>').join('')}
else{r.className='res e';r.textContent='دوگمەی ڕیزێک دابگرە بۆ بینینی ئەنجامەکەی'}
const left=R.map((g,i)=>i).filter(i=>!gone.has(i)),s0=1;
$('tot').textContent='Total: '+left.length;
$('rows').innerHTML=left.length?left.map(i=>'<div class="row"><button class="rb'+(i===sel?' on':'')+'" data-n="'+i+'">ڕیزی '+(s0+i)+'</button><button class="del" data-d="'+i+'">سڕینەوە</button></div>').join(''):'<div class="empty">هیچ ڕیزێک نییە</div>';
}
$('rows').onclick=e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.n!==undefined)sel=+b.dataset.n;
else if(b.dataset.d!==undefined){const i=+b.dataset.d;gone.add(i);if(sel===i)sel=null}
render();
};
function setK(v){k=Math.max(1,Math.min(20,v));$('kv').textContent=k;gen()}
$('km').onclick=()=>setK(k-1);
$('kp').onclick=()=>setK(k+1);
$('N').oninput=gen;
gen();
</script>
</body>
</html>
